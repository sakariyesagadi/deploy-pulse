<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>deploy-pulse — workflow health</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 2rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    header .generated { color: var(--muted); font-size: 0.85rem; }
    .summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1.25rem 1.5rem;
    }
    .pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .pill .count { font-size: 1.8rem; font-weight: 700; }
    .pill .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .pill.green .count { color: var(--green); }
    .pill.yellow .count { color: var(--yellow); }
    .pill.red .count { color: var(--red); }
    main { padding: 0 1.5rem 3rem; display: grid; gap: 1.25rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 10px;
      padding: 1.25rem;
    }
    .card.GREEN { border-left-color: var(--green); }
    .card.YELLOW { border-left-color: var(--yellow); }
    .card.RED { border-left-color: var(--red); }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .card-head h2 { margin: 0; font-size: 1.05rem; }
    .card-head .repo { color: var(--muted); font-weight: 400; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 0.75rem 0 0.5rem;
    }
    .stat .value { font-size: 1.15rem; font-weight: 600; }
    .stat .name { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .reasons { color: var(--muted); font-size: 0.85rem; margin: 0.25rem 0 0.75rem; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
    .chart-box { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; }
    canvas { width: 100% !important; height: 180px !important; }
    footer { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 2rem 1rem; }
    a { color: var(--accent); }
    .empty { color: var(--muted); padding: 2rem 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>🩺 deploy-pulse</h1>
    <div class="generated">GitHub Actions workflow health · generated 2026-10-05 17:58 UTC</div>
  </header>

  <section class="summary">
    <div class="pill green"><span class="count">0</span><span class="label">Green</span></div>
    <div class="pill yellow"><span class="count">0</span><span class="label">Yellow</span></div>
    <div class="pill red"><span class="count">0</span><span class="label">Red</span></div>
    <div class="pill"><span class="count">0</span><span class="label">Workflows</span></div>
  </section>

  <main>
    
      <p class="empty">No workflow data yet. Run <code>python -m src.collector</code> to collect runs.</p>
    
    
  </main>

  <footer>
    Generated by <a href="https://github.com/sakariyesagadi/deploy-pulse">deploy-pulse</a>.
  </footer>

  <script id="chart-data" type="application/json">
    []
  </script>
  <script>
    const cards = JSON.parse(document.getElementById("chart-data").textContent);
    const GRID = "#30363d";
    const TEXT = "#8b949e";
    Chart.defaults.color = TEXT;
    Chart.defaults.borderColor = GRID;

    cards.forEach((card, i) => {
      const idx = i + 1;
      const series = card.series;

      new Chart(document.getElementById("success-" + idx), {
        type: "line",
        data: {
          labels: series.labels,
          datasets: [{
            label: "Success rate %",
            data: series.success_rate,
            borderColor: "#3fb950",
            backgroundColor: "rgba(63,185,80,0.15)",
            spanGaps: true,
            tension: 0.25,
            fill: true,
            pointRadius: 0,
          }],
        },
        options: {
          plugins: { legend: { display: true } },
          scales: { y: { min: 0, max: 100, ticks: { stepSize: 25 } }, x: { ticks: { maxTicksLimit: 6 } } },
        },
      });

      new Chart(document.getElementById("duration-" + idx), {
        type: "line",
        data: {
          labels: series.labels,
          datasets: [{
            label: "Avg duration (s)",
            data: series.avg_duration,
            borderColor: "#58a6ff",
            backgroundColor: "rgba(88,166,255,0.15)",
            spanGaps: true,
            tension: 0.25,
            fill: true,
            pointRadius: 0,
          }],
        },
        options: {
          plugins: { legend: { display: true } },
          scales: { y: { beginAtZero: true }, x: { ticks: { maxTicksLimit: 6 } } },
        },
      });
    });
  </script>
</body>
</html>
